spring:
  flyway:
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}

app:
  auth:
    mode: dingtalk
  dingtalk:
    client-id: ${DINGTALK_CLIENT_ID}
    client-secret: ${DINGTALK_CLIENT_SECRET}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET:law-oa-private}
  document:
    scanner:
      mode: ${DOCUMENT_SCANNER_MODE:clamav}
      host: ${CLAMAV_HOST}
      port: ${CLAMAV_PORT:3310}
