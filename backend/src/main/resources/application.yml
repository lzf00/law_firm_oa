spring:
  application:
    name: law-firm-oa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/law_oa}
    username: ${DB_USERNAME:law_oa}
    password: ${DB_PASSWORD:law_oa_local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: ${REDIS_TIMEOUT:3s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${APP_VERSION:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  tenant:
    organization-id: ${APP_ORGANIZATION_ID:}
  auth:
    mode: ${AUTH_MODE:dingtalk}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT:}}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:law-oa-private}
  dingtalk:
    client-id: ${DINGTALK_CLIENT_ID:}
    client-secret: ${DINGTALK_CLIENT_SECRET:}
    redirect-uri: ${DINGTALK_REDIRECT_URI:}
  document:
    scanner:
      mode: ${DOCUMENT_SCANNER_MODE:deterministic}
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout: ${CLAMAV_TIMEOUT:30s}
    cleanup:
      interval: ${DOCUMENT_CLEANUP_INTERVAL:PT1H}
      batch-size: ${DOCUMENT_CLEANUP_BATCH_SIZE:100}
  jobs:
    metrics-refresh: ${JOBS_METRICS_REFRESH:PT1M}
