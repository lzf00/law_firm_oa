spring:
  application:
    name: law-firm-oa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/law_oa}
    username: ${DB_USERNAME:law_oa}
    password: ${DB_PASSWORD:law_oa_local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  tenant:
    organization-id: ${APP_ORGANIZATION_ID:}
  auth:
    mode: ${AUTH_MODE:dingtalk}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT:}}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:law-oa-private}
  dingtalk:
    client-id: ${DINGTALK_CLIENT_ID:}
    client-secret: ${DINGTALK_CLIENT_SECRET:}
    redirect-uri: ${DINGTALK_REDIRECT_URI:}
