name: commercial-readiness

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-quality-evidence
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/classes/META-INF/sbom/application.cdx.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm sbom --sbom-format=cyclonedx > frontend.cdx.json
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence
          path: |
            frontend/dist
            frontend/frontend.cdx.json

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - name: Scan backend image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0 image
          --scanners vuln
          --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          law_firm_oa-backend:latest
      - name: Scan frontend image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0 image
          --scanners vuln
          --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          law_firm_oa-frontend:latest

  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret, dependency and configuration scan
        run: >-
          docker run --rm
          -v "$PWD:/src:ro"
          aquasec/trivy:0.70.0 fs
          --scanners secret,vuln,misconfig
          --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --skip-dirs .git --skip-dirs frontend/node_modules
          /src

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, GPL-2.0-only, GPL-3.0-only

  integration-and-load:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated application
        run: docker compose up -d --build
      - name: Wait for application
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: API acceptance
        run: node scripts/smoke-test.mjs
      - name: Install browser acceptance runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser, responsive, localization and accessibility acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Representative 100-user load
        run: node scripts/load-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Stop isolated application
        if: always()
        run: docker compose down -v
